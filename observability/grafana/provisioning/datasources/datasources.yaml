apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "\"trace_id\":\"(\\w+)\""
          name: TraceID
          url: "$${__value.raw}"

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        # A custom query, not `tags`: spans carry `service.name=twhp-api` but Loki's `service` label is
        # the Compose service (`api`, `api-dev`, …), so no tag mapping matches and Grafana would hide the
        # link. Alloy sets `service` on every stream (`env` is empty when DEPLOYMENT_ENV is unset), and
        # matching the JSON field, not the bare ID, keeps Loki's and Tempo's own logs of the ID out.
        customQuery: true
        query: '{service=~".+"} |= `"trace_id":"$${__trace.traceId}"`'
