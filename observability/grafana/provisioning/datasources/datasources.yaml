apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "\"trace_id\":\"(\\w+)\""
          name: TraceID
          url: "$${__value.raw}"

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        # A custom query, not `tags`: spans carry `service.name=twhp-api` but Loki's `service` label is
        # the Compose service (`api`, `api-dev`, …), so no tag mapping matches and Grafana would hide the
        # link. Every app line carries `trace_id` in its JSON body and every stream has an `env` label.
        customQuery: true
        query: '{env=~".+"} |= "$${__trace.traceId}"'
