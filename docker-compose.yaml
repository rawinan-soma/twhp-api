services:
  # Dev Migration (one-shot: runs db:push + db:seed then exits)
  migrate-dev:
    build:
      context: .
      target: build
    image: twhp-api:dev
    container_name: twhp-migrate-dev
    env_file:
      - docker.env
    profiles:
      - dev
      - staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "bun run db:push && bun run db:seed"

  # Development Service with Hot-Reload
  api-dev:
    build:
      context: .
      target: build
    image: twhp-api:dev
    container_name: twhp-api-dev
    environment:
      - NODE_ENV=development
    env_file:
      - docker.env
    volumes:
      - .:/app
      - /usr/src/app/node_modules
    profiles:
      - dev
      - staging
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/twhp/api/health').then(r => (r.ok ? process.exit(0) : process.exit(1)))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      migrate-dev:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: bun dev

  # Prod Migration (one-shot: runs db:push + db:seed then exits)
  migrate-prod:
    image: rawinan/twhp-elysia-api:latest
    container_name: twhp-migrate-prod
    env_file:
      - docker.env
    profiles:
      - production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "echo 'do not migrate in production, import csv directly'"

  # API Service (Production)
  api:
    image: rawinan/twhp-elysia-api:latest
    container_name: twhp-api-prod
    restart: always
    environment:
      - NODE_ENV=production
    env_file:
      - docker.env
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/twhp/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - production
    depends_on:
      migrate-prod:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ./server

  # Worker Service (Development)
  worker-dev:
    build:
      context: .
      target: build
    container_name: twhp-workers-dev
    restart: always
    env_file:
      - docker.env
    profiles:
      - dev
      - staging
    depends_on:
      api-dev:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: bun run worker

  # Worker Service (Production)
  worker:
    image: rawinan/twhp-elysia-api:latest
    container_name: twhp-workers
    restart: always
    env_file:
      - docker.env
    profiles:
      - production
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ./worker-bin

  # PostgreSQL 17
  postgres:
    image: postgres:17-alpine
    container_name: twhp-postgres
    restart: always
    profiles:
      - dev
      - production
      - staging
    env_file:
      - docker.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d twhp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: twhp-redis
    restart: always
    profiles:
      - dev
      - production
      - staging
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: twhp-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: "http://localhost/twhp/minio-console"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Nginx Reverse Proxy (Development)
  nginx-backend:
    image: nginx:alpine
    container_name: twhp-nginx
    restart: always
    ports:
      - "127.0.0.1:81:80"
    env_file:
      - docker.env
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    profiles:
      - dev
    depends_on:
      - api-dev
      - minio

  nginx-backend-stg:
    image: nginx:alpine
    container_name: twhp-nginx
    restart: always
    ports:
      - "127.0.0.1:81:80"
    env_file:
      - docker.env
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    profiles:
      - staging
    depends_on:
      - api-dev
      - minio
    networks:
      - default
      - shared-web-network

  # Nginx Reverse Proxy (Production)
  nginx-backend-prod:
    image: nginx:alpine
    container_name: twhp-nginx
    restart: always
    ports:
      - "127.0.0.1:81:80"
    env_file:
      - docker.env
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    profiles:
      - production
    depends_on:
      - api
      - minio
    networks:
      - default
      - shared-web-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  shared-web-network:
    external: true
