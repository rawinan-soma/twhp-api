# Pinned so the Compose project name (and the container/service labels Alloy
# filters on) stay stable regardless of the checkout directory name — this
# repo is routinely checked out into differently-named git worktrees.
name: twhp-elysia

services:
  # Dev Migration (one-shot: runs db:push + db:seed then exits)
  migrate-dev:
    build:
      context: .
      target: build
    image: twhp-api:dev
    container_name: twhp-migrate-dev
    env_file:
      - docker.env
    profiles:
      - dev
      - staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "bun run db:push && bun run db:seed"

  # Development Service with Hot-Reload
  api-dev:
    build:
      context: .
      target: build
    image: twhp-api:dev
    container_name: twhp-api-dev
    environment:
      - NODE_ENV=development
      - TZ=Asia/Bangkok
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      - DEPLOYMENT_ENV=${DEPLOYMENT_ENV:-development}
    env_file:
      - docker.env
    volumes:
      - .:/app
      - /usr/src/app/node_modules
    profiles:
      - dev
      - staging
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/twhp/api/health/live').then(r => (r.ok ? process.exit(0) : process.exit(1)))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      migrate-dev:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # `bun run dev` (host) still pipes through pino-pretty for a human terminal;
    # the container runs the underlying watch command directly so its stdout
    # stays raw JSON for Alloy/Loki, matching worker-dev and the prod `api` command.
    command: bun --watch --preload ./src/telemetry.api.ts src/index.ts

  # Prod Migration (one-shot: runs db:push + db:seed then exits)
  migrate-prod:
    image: rawinan/twhp-elysia-api:latest
    container_name: twhp-migrate-prod
    env_file:
      - docker.env
    profiles:
      - production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "echo 'do not migrate in production, import csv directly'"

  # API Service (Production)
  api:
    image: rawinan/twhp-elysia-api:latest
    container_name: twhp-api-prod
    restart: always
    environment:
      - NODE_ENV=production
      - TZ=Asia/Bangkok
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      - DEPLOYMENT_ENV=${DEPLOYMENT_ENV:-production}
    env_file:
      - docker.env
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/twhp/api/health/live').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - production
    depends_on:
      migrate-prod:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: bun --preload ./src/telemetry.api.ts src/index.ts

  # Worker Service (Development)
  worker-dev:
    build:
      context: .
      target: build
    container_name: twhp-workers-dev
    restart: always
    environment:
      - TZ=Asia/Bangkok
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      - DEPLOYMENT_ENV=${DEPLOYMENT_ENV:-development}
    env_file:
      - docker.env
    profiles:
      - dev
      - staging
    depends_on:
      api-dev:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: bun run worker

  # Worker Service (Production)
  worker:
    image: rawinan/twhp-elysia-api:latest
    container_name: twhp-workers
    restart: always
    environment:
      - TZ=Asia/Bangkok
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      - DEPLOYMENT_ENV=${DEPLOYMENT_ENV:-production}
    env_file:
      - docker.env
    profiles:
      - production
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ./worker-bin

  # PostgreSQL 17
  postgres:
    image: postgres:17-alpine
    container_name: twhp-postgres
    restart: always
    profiles:
      - dev
      - production
      - staging
    env_file:
      - docker.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d twhp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: twhp-redis
    restart: always
    profiles:
      - dev
      - production
      - staging
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: twhp-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: "http://localhost/twhp/minio-console"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Nginx Reverse Proxy (Development)
  nginx-backend:
    image: nginx:alpine
    container_name: twhp-nginx
    restart: always
    ports:
      - "127.0.0.1:81:80"
    environment:
      - TZ=Asia/Bangkok
    env_file:
      - docker.env
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    profiles:
      - dev
    depends_on:
      - api-dev
      - minio

  nginx-backend-stg:
    image: nginx:alpine
    container_name: twhp-nginx
    restart: always
    ports:
      - "127.0.0.1:81:80"
    environment:
      - TZ=Asia/Bangkok
    env_file:
      - docker.env
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    profiles:
      - staging
    depends_on:
      - api-dev
      - minio
    networks:
      - default
      - shared-web-network

  # Nginx Reverse Proxy (Production)
  nginx-backend-prod:
    image: nginx:alpine
    container_name: twhp-nginx
    restart: always
    ports:
      - "127.0.0.1:81:80"
    environment:
      - TZ=Asia/Bangkok
    env_file:
      - docker.env
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    profiles:
      - production
    depends_on:
      - api
      - minio
    networks:
      - default
      - shared-web-network

  # --- Observability profile (opt-in): logs, traces, metrics, dashboards ---
  # See docs/deployment.md "Observability" for ports, retention and access.

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: twhp-alloy
    restart: always
    profiles:
      - observability
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    env_file:
      - observability.env
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    healthcheck:
      # grafana/alloy ships neither curl nor wget; bash's /dev/tcp is what's available.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - loki
      - tempo

  loki:
    image: grafana/loki:3.3.2
    container_name: twhp-loki
    restart: always
    profiles:
      - observability
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yaml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.6.1
    container_name: twhp-tempo
    restart: always
    profiles:
      - observability
    volumes:
      - ./observability/tempo/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/config.yaml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: twhp-prometheus
    restart: always
    profiles:
      - observability
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    env_file:
      - observability.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/prometheus/secrets
        printf '%s' "$$MINIO_PROMETHEUS_TOKEN" > /etc/prometheus/secrets/minio_prometheus_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --web.console.libraries=/usr/share/prometheus/console_libraries \
          --web.console.templates=/usr/share/prometheus/consoles
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.4.0
    container_name: twhp-grafana
    restart: always
    profiles:
      - observability
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
    env_file:
      - observability.env
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - loki
      - tempo
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: twhp-node-exporter
    restart: always
    profiles:
      - observability
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

volumes:
  postgres_data:
  redis_data:
  minio_data:
  alloy_data:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:

networks:
  shared-web-network:
    external: true
